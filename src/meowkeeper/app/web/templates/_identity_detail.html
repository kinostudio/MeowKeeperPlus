<dialog id="identity-detail-dialog" aria-labelledby="identity-detail-title">
<h3 id="identity-detail-title">AI 身分比對依據（實驗性）</h3>
<button class="button secondary" id="identity-detail-close" type="button">關閉</button>
<p>相似度不是準確率；家庭校準尚未通過時只呈現候選，不當作已確認身分。</p>
<video id="identity-detail-video" controls playsinline hidden></video>
<div id="identity-detail-tracks" class="cards"></div>
<p id="identity-detail-message" role="status"></p>
</dialog>
<dialog id="identity-photo-dialog" aria-labelledby="identity-photo-title"><h3 id="identity-photo-title">當次裁切與近似參考照</h3><p id="identity-photo-score"></p><div class="identity-photo-pair"><figure><figcaption>當次事件裁切</figcaption><img id="identity-photo-current" alt="當次事件裁切"></figure><figure><figcaption>近似參考照（不是辨識正確的證明）</figcaption><img id="identity-photo-reference" alt="近似參考照"></figure></div><button class="button secondary" id="identity-photo-close" type="button">返回身分比對</button></dialog>
<script src="/static/js/identity-detail.js?v={{ release_info.cache_key }}" defer></script>
